name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Pi, so CI cannot pass on a version the Pi will not run.
          python-version: '3.13'

      # The tests stub the LifeOS API and never touch audio hardware, so the
      # heavy runtime dependencies are not installed here. portaudio is still
      # needed because pyaudio fails to build without its headers.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq portaudio19-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        run: python -m pytest
